# Tema Catppuccin Mocha (paleta oficial: https://catppuccin.com/palette)

[theme]
base = "dark"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseRadius = "large"
buttonRadius = "full"
showWidgetBorder = true
showSidebarBorder = false
metricValueFontSize = "2.25rem"
metricValueFontWeight = 600

primaryColor = "#cba6f7"              # Mauve
backgroundColor = "#1e1e2e"           # Base
secondaryBackgroundColor = "#313244"  # Surface 0
textColor = "#cdd6f4"                 # Text
borderColor = "#45475a"               # Surface 1
dataframeBorderColor = "#313244"      # Surface 0
dataframeHeaderBackgroundColor = "#181825"  # Mantle
linkColor = "#89b4fa"                 # Blue
codeBackgroundColor = "#181825"       # Mantle

# Colores con nombre (st.badge, :color[texto]) mapeados a la paleta
redColor = "#f38ba8"
orangeColor = "#fab387"
yellowColor = "#f9e2af"
greenColor = "#a6e3a1"
blueColor = "#89b4fa"
violetColor = "#cba6f7"
grayColor = "#9399b2"
redBackgroundColor = "#3e2e40"
orangeBackgroundColor = "#3f343b"
yellowBackgroundColor = "#3f3b41"
greenBackgroundColor = "#323c3f"
blueBackgroundColor = "#2e344d"
violetBackgroundColor = "#38324c"
grayBackgroundColor = "#303042"
redTextColor = "#f38ba8"
orangeTextColor = "#fab387"
yellowTextColor = "#f9e2af"
greenTextColor = "#a6e3a1"
blueTextColor = "#89b4fa"
violetTextColor = "#cba6f7"
grayTextColor = "#9399b2"

# Paletas por defecto de las gráficas
chartCategoricalColors = ["#89b4fa", "#fab387", "#a6e3a1", "#cba6f7", "#94e2d5", "#f9e2af", "#f38ba8", "#b4befe"]
chartSequentialColors = ["#313244", "#454f6c", "#586c95", "#6c89bd", "#7fa6e6", "#8eb5fa", "#97b7fb", "#a1bafc", "#aabcfd", "#b4befe"]
chartDivergingColors = ["#89b4fa", "#7394cc", "#5d739f", "#475272", "#313244", "#62485d", "#925e76", "#c2758f", "#f38ba8"]

[theme.sidebar]
backgroundColor = "#181825"           # Mantle
secondaryBackgroundColor = "#313244"  # Surface 0
